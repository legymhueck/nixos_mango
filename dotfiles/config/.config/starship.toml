# Optimized Starship Prompt Configuration

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$python\
$java\
$nodejs\
$rust\
$golang\
$cmd_duration\
$line_break\
$jobs\
$time\
$character"""

# Prompt modules
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
read_only = "🔒"
read_only_style = "red"
home_symbol = "~"

[os]
disabled = false
style = "bold blue"

# Git Configuration
[git_branch]
symbol = " "
truncation_length = 20
truncation_symbol = "…"
style = "bold purple"

[git_commit]
commit_hash_length = 8
style = "bold yellow"

[git_state]
rebase = "REBASE"
merge = "MERGE"
cherry_pick = "CHERRY-PICK"
revert = "REVERT"
style = "bold yellow"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
stashed = "${count}"
deleted = "✘${count}"
style = "bold red"

# Python Configuration
[python]
symbol = " "
pyenv_version_name = true
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", "setup.cfg"]
style = "bold yellow"
format = '[$symbol$pyenv_prefix($version)(\($virtualenv\))]($style) '

# Java Configuration
[java]
symbol = " "
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts"]
style = "bold red"
format = '[$symbol($version)]($style) '

# Node.js Configuration
[nodejs]
symbol = " "
detect_files = ["package.json", "node_modules", "tsconfig.json"]
style = "bold green"
format = '[$symbol($version)]($style) '

# Rust Configuration
[rust]
symbol = "🦀 "
detect_files = ["Cargo.toml"]
style = "bold red"
format = '[$symbol($version)]($style) '

# Go Configuration
[golang]
symbol = " "
detect_files = ["go.mod"]
style = "bold cyan"
format = '[$symbol($version)]($style) '

# Command Duration
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "

# Time
[time]
disabled = false
format = "[$time]($style) "
time_format = "%T"
use_12hr = false

# Jobs
[jobs]
symbol = "⚡"
style = "bold blue"

